<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominium — Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/login/login-style.css">
</head>
<body>

  <!-- Theme toggle -->
  <div class="theme-toggle">
    <button class="theme-btn" id="themeToggleBtn" title="Modo escuro">
      <i class="bx bx-moon" id="themeToggleIcon"></i>
    </button>
  </div>

  <!-- Login card -->
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <i class="bx bx-building-house"></i>
      </div>
      <h1>Dominium</h1>
      <p>Acesse sua conta para continuar</p>
    </div>

    <!-- Error message (shared between steps) -->
    <div class="error-message hidden" id="loginError">
      <i class="bx bx-error-circle"></i>
      <span></span>
    </div>

    <!-- ===== STEP 1: Credentials form ===== -->
    <div id="stepForm">
      <form id="loginForm" autocomplete="on" novalidate>

        <div class="form-group">
          <label class="form-label" for="inputUsername">Usuário</label>
          <div class="input-wrapper">
            <i class="bx bxs-user input-icon"></i>
            <input
              class="form-input"
              type="text"
              id="inputUsername"
              name="username"
              autocomplete="username"
              placeholder="Digite seu usuário"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="inputPassword">Senha</label>
          <div class="input-wrapper">
            <i class="bx bxs-lock-alt input-icon"></i>
            <input
              class="form-input"
              type="password"
              id="inputPassword"
              name="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            >
            <button type="button" class="password-toggle" id="togglePasswordBtn" title="Mostrar / ocultar senha">
              <i class="bx bx-hide" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="loginSpinner" class="spinner hidden"></span>
          <span>Entrar</span>
        </button>

      </form>
    </div>

    <!-- ===== STEP 2: Company selector ===== -->
    <div id="stepSelector" class="hidden">
      <p class="selector-title">Selecione sua empresa</p>
      <p class="selector-subtitle">Encontramos sua conta em mais de uma empresa. Escolha a correta para continuar.</p>

      <div class="company-list" id="companyList">
        <!-- Populated by login-script.js -->
      </div>

      <button type="button" class="btn-primary" id="selectorConfirmBtn">
        <span>Confirmar</span>
      </button>
      <button type="button" class="btn-secondary" id="selectorBackBtn">
        <i class="bx bx-arrow-back"></i>
        <span>Voltar</span>
      </button>
    </div>

  </div>

  <script src="/shared/config.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/login/login-script.js"></script>
</body>
</html>
