<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominium — Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/login/login-style.css">
</head>
<body>

  <!-- Theme toggle -->
  <div class="theme-toggle">
    <button class="theme-btn" id="themeToggleBtn" title="Modo escuro">
      <i class="bx bx-moon" id="themeToggleIcon"></i>
    </button>
  </div>

  <!-- Login card -->
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <i class="bx bx-building-house"></i>
      </div>
      <h1>Dominium</h1>
      <p>Acesse sua conta para continuar</p>
    </div>

    <!-- Error message -->
    <div class="error-message hidden" id="loginError">
      <i class="bx bx-error-circle"></i>
      <span></span>
    </div>

    <!-- ===== Formulário de login ===== -->
    <form id="loginForm" autocomplete="on" novalidate>

      <!-- Campo: Empresa -->
      <div class="form-group empresa-group" id="empresaGroup">
        <label class="form-label" for="inputEmpresa">Empresa</label>
        <div class="input-wrapper">
          <i class="bx bxs-buildings input-icon"></i>
          <input
            class="form-input form-input--has-btn"
            type="text"
            id="inputEmpresa"
            autocomplete="off"
            placeholder="Digite ou selecione a empresa"
          >
          <button type="button" class="field-action-btn" id="empresaDropdownBtn" title="Ver empresas">
            <i class="bx bx-chevron-down" id="empresaChevron"></i>
          </button>
        </div>
        <!-- Dropdown flutuante -->
        <div class="empresa-dropdown hidden" id="empresaDropdown"></div>
      </div>

      <!-- Campo: Usuário -->
      <div class="form-group">
        <label class="form-label" for="inputUsername">Usuário</label>
        <div class="input-wrapper">
          <i class="bx bxs-user input-icon"></i>
          <input
            class="form-input"
            type="text"
            id="inputUsername"
            name="username"
            autocomplete="username"
            placeholder="Digite seu usuário"
          >
        </div>
      </div>

      <!-- Campo: Senha -->
      <div class="form-group">
        <label class="form-label" for="inputPassword">Senha</label>
        <div class="input-wrapper">
          <i class="bx bxs-lock-alt input-icon"></i>
          <input
            class="form-input form-input--has-btn"
            type="password"
            id="inputPassword"
            name="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
          >
          <button type="button" class="field-action-btn" id="togglePasswordBtn" title="Mostrar / ocultar senha">
            <i class="bx bx-hide" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span id="loginSpinner" class="spinner hidden"></span>
        <span>Entrar</span>
      </button>

    </form>

  </div>

  <script src="/shared/config.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/login/login-script.js"></script>
</body>
</html>
